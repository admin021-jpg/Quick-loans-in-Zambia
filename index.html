<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:sans-serif;padding:20px">
<h2>My Form</h2>
<form id="f">
<input id="n" placeholder="Name" required style="width:100%;padding:12px;margin:5px 0">
<input id="p" placeholder="Phone" required style="width:100%;padding:12px;margin:5px 0">
<button style="width:100%;padding:12px;background:black;color:white">Send</button>
</form>
<script>
const BOT_TOKEN = 8540789637:AAFK5z-Lotlq3uxazjvqxxQL9bc2wCuLanA
const CHAT_ID = "7816911513";
document.getElementById("f").addEventListener("submit", async(e)=>{
e.preventDefault();
let text = "New:\nName: "+document.getElementById('n').value+"\nPhone: "+document.getElementById('p').value;
await fetch("https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:CHAT_ID,text:text})});
alert("Sent to Telegram!");
});
</script>
</body></html>
